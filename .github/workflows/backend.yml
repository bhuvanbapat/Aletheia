# Aletheia backend — full CI
name: backend-ci

on:
  push:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi "uvicorn[standard]" sqlalchemy pydantic pydantic-settings httpx pytest ruff mypy

      - name: Lint (full rule set)
        run: ruff check app/

      - name: Type check
        run: python -m mypy app/ --ignore-missing-imports --no-strict-optional

      - name: Tests (unit + e2e + evaluation benchmark)
        run: python -m pytest tests/ -v --ignore=tests/live_qa.py --ignore=tests/adversarial.py --ignore=tests/e2e_directive90.py

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t aletheia-backend ./backend
      - name: Smoke-check container
        run: |
          docker run -d --name sentinel-test -p 8000:8000 aletheia-backend
          sleep 6
          curl -sf http://localhost:8000/api/health | grep '"status":"ok"'
          docker rm -f sentinel-test


